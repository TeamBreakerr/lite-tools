<lite-tools class="lite-tools-settings plugins">
  <h1>功能</h1>

  <!-- 消息相关 -->
  <div class="wrap chatMessage">
    <div class="vertical-list-item title">
      <h2>消息相关</h2>
      <svg class="icon is-fold" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 8L12 17L3 8" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
      </svg>
    </div>
    <ul class="hidden">
      <hr class="horizontal-dividing-line" />
      <li class="vertical-list-item">
        <div>
          <h2>删除消息气泡皮肤</h2>
          <span class="secondary-text">花里胡哨的影响阅读 - 重载消息生效</span>
        </div>
        <div class="q-switch" data-config="message.deleteBubbleSkin">
          <span class="q-switch__handle"></span>
        </div>
      </li>
      <hr class="horizontal-dividing-line" />
      <li class="vertical-list-item">
        <div>
        </div>
          <span class="q-switch__handle"></span>
        </div>
      </li>
    </ul>
  </div>
  <h1 class="version">当前版本<span class="link tag-version" data-href="https://github.com/xiyuesaves/lite_tools/tree/v4">v0.0.0</span></h1>
</lite-tools>
